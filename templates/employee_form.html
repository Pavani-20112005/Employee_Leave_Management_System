{% extends "base.html" %}

{% block title %}Add Employee - LeaveManager{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>👤 Add New Employee</h1>
        <p class="subtitle">Add a new member to your organization</p>
    </div>
    <a href="{{ url_for('employees') }}" class="btn btn-outline">← Back to Employees</a>
</div>

<div class="form-container">
    <form method="post">
        <div class="form-group">
            <label>Full Name <span class="required">*</span></label>
            <input type="text" name="name" class="form-control" placeholder="Enter full name" required>
        </div>

        <div class="form-group">
            <label>Email Address <span class="required">*</span></label>
            <input type="email" name="email" class="form-control" placeholder="Enter email address" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Department <span class="required">*</span></label>
                <input type="text" name="department" class="form-control" placeholder="e.g., IT, HR, Finance" required>
            </div>
            <div class="form-group">
                <label>Role <span class="required">*</span></label>
                <input type="text" name="role" class="form-control" placeholder="e.g., Manager, Developer" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;">
            💾 Save Employee
        </button>
    </form>
</div>
{% endblock %}
