{% extends "base.html" %}

{% block title %}Login - LeaveManager{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto;">
    <div style="background: white; padding: 2.5rem; border-radius: var(--radius); box-shadow: var(--shadow-lg); border: 1px solid var(--gray-200);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 3rem; margin-bottom: 0.5rem;">🔐</div>
            <h1 style="font-size: 1.75rem; font-weight: 700;">Welcome Back</h1>
            <p style="color: var(--gray-500);">Sign in to manage your leave requests</p>
        </div>
        
        <form method="post">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 1rem;">
                Sign In
            </button>
        </form>
        
        <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--gray-200); padding-top: 1.5rem;">
            <p style="color: var(--gray-500); font-size: 0.9rem;">
                Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Register here</a>
            </p>
            <p style="color: var(--gray-400); font-size: 0.8rem; margin-top: 0.5rem;">
                Demo: admin/Admin@123 | manager/Manager@123 | employee/Employee@123
            </p>
        </div>
    </div>
</div>
{% endblock %}
