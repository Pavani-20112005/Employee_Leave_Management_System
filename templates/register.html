{% extends "base.html" %}

{% block title %}Register - LeaveManager{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 2rem auto;">
    <div
        style="background: white; padding: 2.5rem; border-radius: var(--radius); box-shadow: var(--shadow-lg); border: 1px solid var(--gray-200);">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 3rem; margin-bottom: 0.5rem;">📝</div>
            <h1 style="font-size: 1.75rem; font-weight: 700;">Create Account</h1>
            <p style="color: var(--gray-500);">Join the Leave Management System</p>
        </div>

        <form method="post">
            <div class="form-group">
                <label>Username <span class="required">*</span></label>
                <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                <small style="color: var(--gray-400); font-size: 0.8rem;">Minimum 3 characters</small>
            </div>

            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password <span class="required">*</span></label>
                <input type="password" name="password" class="form-control" placeholder="Create a strong password"
                    required>
                <small style="color: var(--gray-400); font-size: 0.8rem;">Minimum 8 characters with uppercase,
                    lowercase, and number</small>
            </div>

            <div class="form-group">
                <label>Confirm Password <span class="required">*</span></label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Confirm your password"
                    required>
            </div>

            <div class="form-group">
                <label>Role</label>
                <select name="role" class="form-control">
                    <option value="employee">Employee</option>
                    <option value="manager">Manager</option>
                    {% if session.get('role') == 'admin' %}
                    <option value="admin">Admin</option>
                    {% endif %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary"
                style="width: 100%; justify-content: center; padding: 12px; font-size: 1rem;">
                Register
            </button>
        </form>

        <div
            style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--gray-200); padding-top: 1.5rem;">
            <p style="color: var(--gray-500); font-size: 0.9rem;">
                Already have an account? <a href="{{ url_for('login') }}"
                    style="color: var(--primary); font-weight: 600; text-decoration: none;">Sign in here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
