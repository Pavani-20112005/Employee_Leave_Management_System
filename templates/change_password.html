{% extends "base.html" %}

{% block title %}Change Password - LeaveManager{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 0 auto;">
    <div class="page-header">
        <div>
            <h1>🔑 Change Password</h1>
            <p class="subtitle">Update your password for better security</p>
        </div>
    </div>

    <div
        style="background: white; padding: 2rem; border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--gray-200);">
        <form method="post">
            <div class="form-group">
                <label>Current Password <span class="required">*</span></label>
                <input type="password" name="current_password" class="form-control" placeholder="Enter current password"
                    required>
            </div>

            <div class="form-group">
                <label>New Password <span class="required">*</span></label>
                <input type="password" name="new_password" class="form-control" placeholder="Enter new password"
                    required>
                <small style="color: var(--gray-400); font-size: 0.8rem;">Minimum 8 characters with uppercase,
                    lowercase, and number</small>
            </div>

            <div class="form-group">
                <label>Confirm New Password <span class="required">*</span></label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password"
                    required>
            </div>

            <button type="submit" class="btn btn-primary"
                style="width: 100%; justify-content: center; padding: 12px; font-size: 1rem;">
                Update Password
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center;">
            <a href="{{ url_for('profile') }}" style="color: var(--gray-500); text-decoration: none;">← Back to
                Profile</a>
        </div>
    </div>
</div>
{% endblock %}
